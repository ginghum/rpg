name: Reconcile obsolete Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
  pages: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retire the obsolete deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const root = 'https://api.github.com/repos/' + process.env.GH_REPO;
          const headers = {Authorization:'Bearer '+process.env.GH_TOKEN, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2026-03-10', 'Content-Type':'application/json'};
          const record = await fetch(root+'/deployments/7470727865', {headers});
          if (!record.ok) throw new Error('Cannot inspect obsolete deployment: '+record.status);
          const data = await record.json();
          if (data.sha !== '55a6c4d00ef94f097a0034d072f9cc0547d5b71d' || data.environment !== 'github-pages') throw new Error('Deployment identity mismatch');
          const status = await fetch(root+'/deployments/7470727865/statuses', {method:'POST',headers,body:JSON.stringify({state:'inactive',description:'Superseded by the corrected RPG release',auto_inactive:false})});
          console.log('Retire deployment: HTTP '+status.status);
          if (status.status !== 201) throw new Error('Cannot mark obsolete deployment inactive');
          const cancel = await fetch(root+'/pages/deployments/55a6c4d00ef94f097a0034d072f9cc0547d5b71d/cancel', {method:'POST',headers});
          console.log('Cancel obsolete Pages operation: HTTP '+cancel.status);
          if (cancel.status !== 204) {
            const detail=await cancel.json().catch(()=>({}));
            console.log('Cancellation result: '+String(detail.message||'No detail'));
          }
          JS
